[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-cleaner-pro"
version = "0.2.0"
description = "Clean messy CSV and XLSX files into a workbook where every change is visible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase Builds" }]
dependencies = ["openpyxl>=3.1", "rapidfuzz>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-openpyxl"]
app = ["streamlit>=1.37"]

[project.scripts]
excel-cleaner = "excel_cleaner_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel_cleaner_pro = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["excel_cleaner_pro", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
files = ["src/excel_cleaner_pro"]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["excel_cleaner_pro", "app"]
