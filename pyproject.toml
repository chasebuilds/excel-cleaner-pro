[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-cleaner-pro"
version = "0.2.0"
description = "Clean messy CSV and XLSX files into a workbook where every change is visible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase Builds" }]
dependencies = ["openpyxl>=3.1", "rapidfuzz>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
app = ["streamlit>=1.37"]

[project.scripts]
excel-cleaner = "excel_cleaner_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel_cleaner_pro = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["excel_cleaner_pro", "app"]
